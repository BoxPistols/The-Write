<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 194" width="760" height="194" role="img" aria-label="1文直したあと、スコアが更新されるまで">
<style>
  svg { --s1: #2a78d6; --s2: #eb6834; --ink: #0b0b0b; --ink2: #52514e; --ink3: #8a8a84; --line: #e6e6e1; --surface: #fcfcfb; }
  @media (prefers-color-scheme: dark) {
    svg { --s1: #3987e5; --s2: #d95926; --ink: #ffffff; --ink2: #c3c2b7; --ink3: #8a8a84; --line: #2e2e2c; --surface: #1a1a19; }
  }
  .bg { fill: var(--surface); }
  .title { fill: var(--ink); font: 600 15px system-ui, sans-serif; }
  .subtitle { fill: var(--ink2); font: 400 12px system-ui, sans-serif; }
  .rowlabel { fill: var(--ink2); font: 400 12px system-ui, sans-serif; }
  .value { fill: var(--ink2); font: 500 11px ui-monospace, monospace; }
  .tick { fill: var(--ink3); font: 400 10px ui-monospace, monospace; }
  .legend { fill: var(--ink2); font: 400 12px system-ui, sans-serif; }
  .grid { stroke: var(--line); stroke-width: 1; }
</style>
<rect class="bg" x="0" y="0" width="760" height="194" />
<text class="title" x="24" y="30">1文直したあと、スコアが更新されるまで</text>
